<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" width="820" height="470"
     role="img" aria-labelledby="fig1-title fig1-desc"
     font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <title id="fig1-title">The care continuum, and the case for shifting left</title>
  <desc id="fig1-desc">A horizontal continuum in three bands. On the left, community and
    home: prevention, exercise and social connection. In the middle, residential aged
    care: ongoing daily support. On the right, acute hospital care: fracture, surgery and
    rehabilitation. Cost and intensity of care rise from left to right. An arrow above the
    bands points leftward, showing that effort and investment moved earlier in the
    continuum keep people out of the more intensive settings on the right.</desc>

  <defs>
    <marker id="arrow-left" viewBox="0 0 12 12" refX="10" refY="6"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 12 0 L 0 6 L 12 12 z" fill="#1064A8"/>
    </marker>
    <marker id="arrow-right" viewBox="0 0 12 12" refX="2" refY="6"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1064A8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="820" height="470" fill="#FFFFFF"/>

  <line x1="760" y1="52" x2="60" y2="52" stroke="#1064A8" stroke-width="4"
        marker-end="url(#arrow-left)"/>
  <text x="60" y="32" font-size="18" font-weight="700" fill="#1064A8">Shift effort and investment left</text>
  <text x="60" y="82" font-size="14" fill="#58595B">Keeping people steady on their feet at home is the least costly place to act.</text>

  <rect x="40"  y="125" width="272" height="86" rx="6" fill="#F0921E"/>
  <rect x="322" y="125" width="222" height="86" rx="6" fill="#29ABE2"/>
  <rect x="554" y="125" width="226" height="86" rx="6" fill="#8CC63F"/>

  <circle cx="70"  cy="168" r="18" fill="#FFFFFF"/>
  <circle cx="352" cy="168" r="18" fill="#FFFFFF"/>
  <circle cx="584" cy="168" r="18" fill="#FFFFFF"/>
  <g font-size="21" font-weight="700" fill="#24292E" text-anchor="middle">
    <text x="70"  y="176">1</text>
    <text x="352" y="176">2</text>
    <text x="584" y="176">3</text>
  </g>

  <g font-size="21" font-weight="700" fill="#24292E">
    <text x="40"  y="252">1. Community and home</text>
    <text x="322" y="252">2. Residential care</text>
    <text x="554" y="252">3. Acute hospital</text>
  </g>
  <g font-size="15" fill="#58595B">
    <text x="40"  y="278">Exercise, balance, strength,</text>
    <text x="40"  y="300">social connection, prevention</text>
    <text x="322" y="278">Ongoing daily support</text>
    <text x="554" y="278">Fracture, surgery,</text>
    <text x="554" y="300">rehabilitation</text>
  </g>

  <line x1="40" y1="358" x2="780" y2="358" stroke="#1064A8" stroke-width="4"
        marker-end="url(#arrow-right)"/>
  <text x="40" y="390" font-size="16" font-weight="600" fill="#1064A8">Cost, intensity and disruption to life increase</text>

  <g font-size="14" fill="#58595B">
    <text x="40" y="432">Adapted from Eric Dishman's care continuum, Figure 3-1 in The Future of Home Health Care:</text>
    <text x="40" y="452">Workshop Summary (Institute of Medicine / National Research Council, 2015). Original redrawing.</text>
  </g>
</svg>
